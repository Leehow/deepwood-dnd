name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'codex/**'

jobs:
  contracts-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Transport contract checks
        run: bash scripts/quality/check_transport_contracts.sh

      - name: Repo hygiene checks
        run: bash scripts/quality/check_repo_hygiene.sh

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend focused vitest
        working-directory: frontend
        run: npx vitest run tests/events/appEventBus.test.ts

  backend-focused:
    runs-on: ubuntu-latest
    env:
      # Settings-safe dummies: these focused tests must not connect to any service.
      # CI has no postgres/redis for this backend job; values are syntactically valid only.
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost/test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Backend focused pytest
        working-directory: backend
        run: PYTHONPATH=. pytest --noconftest tests/unit/test_core_dependencies.py tests/unit/test_runtime_schema_service.py -q

      - name: Class/level-up QA harness (pure-logic gate)
        # DB-free subset: SRD reference tables, the progression generator, and the smoke
        # oracle. The full DB-backed sweep (walks/probes/invariants/differential/multiclass)
        # runs locally with TEST_DATABASE_URL — CI here has no postgres service.
        working-directory: backend
        run: PYTHONPATH=. pytest --noconftest tests/qa_classes/test_reference_tables.py tests/qa_classes/test_generator.py tests/qa_classes/test_oracles_smoke.py -q

      - name: Backend syntax gate
        run: python -m py_compile backend/app/core/dependencies.py backend/app/services/runtime_schema_service.py backend/app/services/websocket_manager.py
