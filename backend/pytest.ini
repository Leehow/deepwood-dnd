[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage settings with 80% target for backend
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# NOTE:
# Keep the coverage config sections below so teams with pytest-cov installed can
# still run coverage explicitly, e.g.:
#   pytest --cov=app --cov-report=term-missing --cov-report=html:htmlcov \
#          --cov-report=xml:coverage.xml --cov-fail-under=80 --cov-branch

# Test markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, API)
    e2e: End-to-end tests (full stack)
    slow: Slow running tests
    websocket: WebSocket specific tests
    performance: Performance tests
    optimization: Optimization related tests

# Logging
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration
[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__init__.py
    */migrations/*
    */alembic/*
    */scripts/*
branch = True

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
fail_under = 80
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml